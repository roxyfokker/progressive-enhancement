<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>File upload met preview / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			.upload-wrapper{
				position: relative;
				border-radius: 0.5rem;
				label{
					position: relative;
					background-color: #5DE0B7;
					border: solid 0.15rem #05043B;
					border-radius: 0.5rem;
					text-align: center;
					padding: 5rem 3rem;
					display: block;
					cursor: pointer;
					input[type="file"]{
						position: absolute;
						width: 1px;
						height: 1px;
						opacity: 0;
						overflow: hidden;
					}
				}
				output{
					position: absolute;
					inset: 0;
					pointer-events: none;
					img{
						border-radius: 0.5rem;
						width: 100%;
  						height: 100%;
						object-fit: cover;
						display: none;
						&[src]:not([src=""]){
							display: block;
						}
					}

				}
			}
			button{
				margin-top: 0.5rem;
			}
		</style>
		<script type="module">

			const fileInput = document.querySelector('input[type="file"]')
			const preview = document.querySelector('output img')
			const wrapper = document.querySelector('.upload-wrapper')

			fileInput.addEventListener('change', function() {
				const url = URL.createObjectURL(fileInput.files[0])
  				preview.src = url
			})

			document.querySelector('form').addEventListener('reset', function() {
				preview.src = ''
			})
		</script>
	</head>
	<body>
		<h1>File upload met preview</h1>

		<!-- Voor het uploaden van een bestand heb je altijd een formulier nodig.
		     Dus die krijg je alvast. Maak je over de server niet druk; het gaat om de UI. -->
		<form method="post">
			<div class="upload-wrapper">
				<label>
					Selecteer je afbeelding
					<input type="file" accept="image/*" class="file-uploader"> 
				</label>

				<output>
					<img src="" alt="">
				</output>
			</div>
			<button type="reset" class="fdnd-button">Verwijderen</button>
			<button type="submit" class="fdnd-button">Uploaden</button>
		</form>

		<details open>
			<summary>Demo video</summary>
			<video src="assets/file.mp4" width="1496" height="496" controls muted autoplay loop>
				<a href="assets/file.mp4">assets/file.mp4</a>
			</video>
		</details>
	</body>
</html>
