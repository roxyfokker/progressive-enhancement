<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Favorieten picker / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			form{
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				width: 100dvw;
				height: 20rem;
			}
			
			input[type="color"] {
				position: absolute;
				inset: 0;
				z-index: 0;
				width: 100%;
				height: 100%;
				border: none;
				cursor: pointer;
			}

			input[type="text"] {
				position: relative;
				z-index: 9999;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				min-width: 3ch;
				width: 20ch;
				height: 2rem;
				border: none;
				border-radius: 0.5rem;
				font-size: 1.5rem;
				font-weight: bold;
				padding: 0.5rem;
				text-align: center;

				@supports (field-sizing: content) {
					field-sizing: content;
					width: auto;
				}
			}
		</style>
	</head>

	<body>
		<h1>Favorieten picker</h1>

		<form>
			<label>
				<input type="text" list="docenten-lijst" value="Koop Reynders">
				<datalist id="docenten-lijst">
					<option value="Charley Muhren"></option>
					<option value="Cyd Stumpel"></option>
					<option value="Dion Pieters"></option>
					<option value="Dorien Drees"></option>
					<option value="Joost Faber"></option>
					<option value="Justus Sturkenboom"></option>
					<option value="Koop Reynders"></option>
					<option value="Krijn Hoetmer"></option>
					<option value="Sanne 't Hooft"></option>
					<option value="Suus ten Voorde"></option>
				</datalist>	
			</label>
			<label>
				<input type="color" list="kleuren-lijst" value="#A675F5">
				<datalist id="kleuren-lijst">
					<option value="#A675F5"></option>
					<option value="#050542"></option>
					<option value="#66E5BF"></option>
					<option value="#FFFC86"></option>
				</datalist>
			</label>
		</form>

			<!-- Een lijstje met docenten
			Charley Muhren
			Cyd Stumpel
			Dion Pieters
			Dorien Drees
			Joost Faber
			Justus Sturkenboom
			Koop Reynders
			Krijn Hoetmer
			Sanne 't Hooft
			Suus ten Voorde
			-->

			<!-- De kleurcodes van FDND:
			#A675F5
			#050542
			#66E5BF
			#FFFC86
			-->

		<details open>
			<summary>Demo video</summary>
			<video src="assets/pickers.mp4" width="749" height="417" controls muted autoplay loop>
				<a href="assets/pickers.mp4">assets/pickers.mp4</a>
			</video>
		</details>
	</body>
</html>
